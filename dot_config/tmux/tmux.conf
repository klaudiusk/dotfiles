# ~/.config/tmux/tmux.conf
# This file is managed by chezmoi. The plugins are not: TPM owns
# ~/.config/tmux/plugins and bootstraps itself on a fresh machine (see the end).
#
#   prefix + I        install the plugins listed below
#   prefix + U        update them
#   prefix + alt + u  remove plugins that are no longer listed
#   prefix + r        reload this file

# --- Terminal -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"
set -s focus-events on        # Neovim's FocusGained -> hotreload.lua re-reads files edited outside
set -g allow-passthrough on   # let apps talk to the outer terminal: Claude Code notifications, image protocols
# Extended keys: lets Shift+Enter, Ctrl+Shift+<key> etc. reach apps (Claude Code
# newline, Neovim). Only terminals with the kitty keyboard protocol send them;
# gnome-terminal (VTE) does not, so it is scoped to kitty and ghostty.
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys,xterm-ghostty:extkeys'
set -g set-clipboard on       # apps may write the clipboard via OSC 52; tmux-yank covers copy mode
set -g mouse on
set -g history-limit 1000000
set -g display-time 4000      # messages stay 4 s (tmux default: 750 ms)
set -g status-interval 5
set -g status-keys emacs      # emacs keys in the ":" prompt; copy mode stays vi (below)
setw -g aggressive-resize on  # size to the smallest client on this window, not on any window

# --- Prefix -------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Windows and panes --------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New panes open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Previous / next window
bind C-p previous-window
bind C-n next-window
# The same without prefix. Caveat: gnome-terminal (VTE) has no extended-keys
# support, so it sends Ctrl+Shift+h as plain Ctrl+h, which vim-tmux-navigator
# takes. These two only work from a terminal that speaks the kitty keyboard
# protocol (kitty, ghostty, foot, wezterm, alacritty).
bind -n C-S-H previous-window
bind -n C-S-L next-window

# --- Copy mode (vi) -----------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- Plugins ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across Neovim splits and tmux panes
set -g @plugin 'tmux-plugins/tmux-yank'            # copy-mode y -> system clipboard (wl-copy)
set -g @plugin 'omerxx/tmux-floax'                 # prefix + j: floating scratch pane
set -g @plugin 'catppuccin/tmux#v2.3.0'            # pinned: v2 changed the config format

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'j'
set -g @floax-border-color 'orange'
set -g @floax-text-color 'beige'

# --- Theme: catppuccin v2 -----------------------------------------------------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
# Load the theme before building the status line from its modules.
if "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
   "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"
set -g status-position bottom
set -g status-left ''
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_application}'   # or @catppuccin_status_directory
set -ag status-right '#{E:@catppuccin_status_session}'

# --- TPM, keep last. Clones itself and installs the plugins on a fresh machine.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
